name: Backfill past bets (run once)

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Date your alerts started (YYYY-MM-DD)"
        required: true

permissions:
  contents: write   # to save copy_ledger.csv
  actions: write    # to start the tracker refresh afterward

concurrency:
  group: copy-watcher   # waits for any watcher run so they don't both edit the ledger
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add past bets to the ledger
        run: python backfill_ledger.py --since "${{ inputs.since }}" --unit 10

      - name: Save ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f copy_ledger.csv ]; then git add copy_ledger.csv; fi
          git diff --cached --quiet && exit 0
          git commit -m "Backfill past copied bets"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      - name: Refresh the tracker now
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run copy-tracker.yml
