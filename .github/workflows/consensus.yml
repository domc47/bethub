name: consensus-alerts

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # needed to save consensus_state.json

concurrency:
  group: consensus-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for consensus plays
        run: python consensus.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TZ_NAME: America/New_York

      - name: Save state (so you don't get repeat alerts)
        run: |
          git config user.name "bethub-bot"
          git config user.email "bethub-bot@users.noreply.github.com"
          git add consensus_state.json
          if ! git diff --cached --quiet; then
            git commit -m "consensus state"
            git pull --rebase
            git push
          fi
