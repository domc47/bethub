name: Copy-trade watcher

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:

concurrency:
  group: copy-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Remembers which trades were already alerted, without committing to the repo
      - name: Restore watcher state
        uses: actions/cache/restore@v4
        with:
          path: watcher_state.json
          key: watcher-state-${{ github.run_id }}
          restore-keys: watcher-state-

      - name: Check traders and send alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          ALERT_TZ: America/Chicago
        run: python copy_watcher.py --unit 10

      - name: Save watcher state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: watcher_state.json
          key: watcher-state-${{ github.run_id }}
