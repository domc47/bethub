name: Polymarket bet watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: pm-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restore last-seen state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: pm-state-${{ github.run_id }}
          restore-keys: pm-state-

      - name: Check for new bets
        run: python3 watch.py
        env:
          PM_USERNAMES: homerunhazard
          LEADERBOARD_TOP: "10"
          LEADERBOARD_PERIOD: "MONTH"
          LEADERBOARD_ORDER: "PNL"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MIN_USD: "5000"
          BUYS_ONLY: "true"

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: pm-state-${{ github.run_id }}
